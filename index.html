<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f7f92">
  <title>Merge Game – Prototype</title>
  <style>
    :root { --top: #217f92; --bottom: #8fd3bf; --ink: #1d2b36; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(120% 80% at 50% 45%, #3aa6a8 0%, transparent 70%), linear-gradient(var(--top), var(--bottom));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
    }
    /* Desktop / landscape: a phone-shaped stage. Portrait phones: full screen. */
    #stage {
      position: relative;
      height: calc(100dvh - 48px); aspect-ratio: 900 / 1750; max-width: calc(100vw - 32px);
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 30px 80px rgba(8, 40, 50, .35), 0 0 0 6px rgba(255, 255, 255, .18);
      background: linear-gradient(var(--top), var(--bottom));
    }
    @media (max-aspect-ratio: 3/4) {
      #stage { width: 100vw; height: 100dvh; max-width: none; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
    }
    #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

    #loader {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: linear-gradient(var(--top), var(--bottom)); color: #fff; transition: opacity .4s ease;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #bar { width: min(56%, 220px); height: 6px; border-radius: 99px; background: rgba(255,255,255,.28); overflow: hidden; }
    #fill { height: 100%; width: 0; border-radius: 99px; background: rgba(255,255,255,.9); transition: width .15s; }
    #pct { font-size: 13px; opacity: .8; font-variant-numeric: tabular-nums; }
    #error { display: none; position: absolute; left: 16px; right: 16px; bottom: 16px; padding: 12px 14px; border-radius: 12px; background: #fff; color: var(--ink); font-size: 13px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <div id="bar"><div id="fill"></div></div>
      <div id="pct">Loading demo…</div>
    </div>
    <div id="error"></div>
  </div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Merge Demo",
      productVersion: "1.0",
      // cap at 2x: sharper than 1x on phones without paying for 3x fill-rate
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) {
        if (type !== "error") { console.warn(msg); return; }
        var e = document.getElementById("error");
        e.textContent = msg; e.style.display = "block";
      },
    };

    var fill = document.getElementById("fill"), pct = document.getElementById("pct");
    var script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        fill.style.width = Math.round(p * 100) + "%";
        pct.textContent = "Loading demo… " + Math.round(p * 100) + "%";
      }).then(function () {
        document.getElementById("loader").classList.add("done");
      }).catch(function (msg) { config.showBanner(String(msg), "error"); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
